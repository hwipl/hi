[package]
name = "hi"
version = "0.1.0"
authors = ["hwipl"]
edition = "2024"

[dependencies]
# use current git version for dependency updates, dependabot fixes
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "70bf5e2f5c64cfa36405ccf9f4f1690afd8abf66", features = ["gossipsub", "mdns", "request-response", "tcp", "tls", "dns", "tokio", "noise", "yamux", "macros"] }
futures = "0.3.34"
minicbor = { version = "2.3.0", features = ["std", "derive"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
log = "0.4.34"
env_logger = "0.11.11"
rand = "0.10.3"
whoami = "2.1.3"
# disable default features to fix issue with old time version,
# should be resolved in next chrono version
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
tokio = { version = "1.53.1", features = ["fs", "io-std"] }
