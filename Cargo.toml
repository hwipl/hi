[package]
name = "hi"
version = "0.1.0"
authors = ["hwipl"]
edition = "2024"

[dependencies]
# use current git version dated 2026-01-07 to remove lru dependency for dependabot alert
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "6a6814bb698b01c40d6ce08eb0f61281c909124f", features = ["gossipsub", "mdns", "request-response", "tcp", "tls", "dns", "tokio", "noise", "yamux", "macros"] }
futures = "0.3.32"
minicbor = { version = "2.2.2", features = ["std", "derive"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
log = "0.4.32"
env_logger = "0.11.10"
rand = "0.10.1"
whoami = "2.1.2"
# disable default features to fix issue with old time version,
# should be resolved in next chrono version
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
tokio = { version = "1.52.3", features = ["fs", "io-std"] }
