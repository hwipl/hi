[package]
name = "hi"
version = "0.1.0"
authors = ["hwipl"]
edition = "2024"

[dependencies]
# use current git version for dependency updates, dependabot fixes
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "93c505994dfb99bf47f44a415d65d4eefa66ab02", features = ["gossipsub", "mdns", "request-response", "tcp", "tls", "dns", "tokio", "noise", "yamux", "macros"] }
futures = "0.3.33"
minicbor = { version = "2.2.2", features = ["std", "derive"] }
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6.0.0"
log = "0.4.33"
env_logger = "0.11.11"
rand = "0.10.2"
whoami = "2.1.2"
# disable default features to fix issue with old time version,
# should be resolved in next chrono version
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "wasmbind"] }
tokio = { version = "1.53.0", features = ["fs", "io-std"] }
